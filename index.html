<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PixelForge — Where Pixels Come Alive</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- =========================
         TOP BAR
         ========================= -->

    <header class="topbar">

        <div class="brand">

            <div class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 48 48">

                     <rect x="8" y="6" width="8" height="36"></rect>

                     <rect x="16" y="6" width="16" height="8"></rect>

                     <rect x="32" y="10" width="8" height="14"></rect>

                    <rect x="16" y="20" width="16" height="8"></rect>

                </svg>
            </div>

            <div class="brand-copy">
                <h1>
                    <span class="pixel-text">Pixel</span><span class="forge-text">Forge</span>
                </h1>

                <p>Where Pixels Come Alive</p>
            </div>

        </div>


        <div class="top-actions">

            <button id="saveButton" class="top-action">
                <svg viewBox="0 0 24 24" class="ui-icon">
                    <path d="M5 3h12l3 3v15H5z"></path>
                    <path d="M8 3v6h8V3"></path>
                    <path d="M8 21v-7h8v7"></path>
                </svg>
                <span>Save</span>
            </button>


            <button id="exportPNG" class="top-action export-action">
                <svg viewBox="0 0 24 24" class="ui-icon">
                    <path d="M12 3v11"></path>
                    <path d="m8 10 4 4 4-4"></path>
                    <path d="M4 17v3h16v-3"></path>
                </svg>
                <span>Export</span>
            </button>

        </div>

    </header>


    <!-- =========================
         MAIN WORKSPACE
         ========================= -->

    <main class="workspace">


        <!-- LEFT TOOLS -->

        <aside class="tool-rail">

            <button class="tool active" data-tool="pen">

                <svg viewBox="0 0 24 24" class="tool-icon">
                    <path d="m4 20 4.5-1 9.8-9.8a2.8 2.8 0 0 0-4-4L4.5 15z"></path>
                    <path d="m13 6 4 4"></path>
                    <path d="M4 20h4"></path>
                </svg>

                <span class="tool-label">Draw</span>

            </button>


            <button class="tool" data-tool="eraser">

                <svg viewBox="0 0 24 24" class="tool-icon">
                    <path d="m7 17 9.5-9.5a2.8 2.8 0 0 1 4 4L11 21H5l-2-2a2.8 2.8 0 0 1 0-4l8-8"></path>
                    <path d="m13 21h7"></path>
                </svg>

                <span class="tool-label">Eraser</span>

            </button>


            <button class="tool" data-tool="fill">

                <svg viewBox="0 0 24 24" class="tool-icon">
                    <path d="m7 3 9 9"></path>
                    <path d="m5 5 8 8-5 5-3-3z"></path>
                    <path d="M14 14c0 3 2 4 4 4s3-2 3-4c0-1.5-1-3-3-5-2 2-4 3.5-4 5z"></path>
                </svg>

                <span class="tool-label">Fill</span>

            </button>

        </aside>


        <!-- CENTER CANVAS -->

        <section class="canvas-section">

            <div class="canvas-frame">

                <canvas id="pixelCanvas"></canvas>

            </div>

        </section>

    </main>


    <!-- =========================
         COLOR PALETTE
         ========================= -->

    <section class="color-dock">

        <div class="color-dock-inner">

            <div class="palette-heading">

                <div class="palette-title-row">

                    <svg viewBox="0 0 24 24" class="palette-icon">
                        <path d="m12 3 8 4.5-8 4.5-8-4.5z"></path>
                        <path d="m4 12 8 4.5 8-4.5"></path>
                        <path d="m4 16.5 8 4.5 8-4.5"></path>
                    </svg>

                    <span>Palette</span>

                </div>

                <span class="palette-hint">Pick a color</span>

            </div>


            <div class="color-palette">

                <button class="color" data-color="#000000" style="background:#000000;"></button>
                <button class="color" data-color="#ffffff" style="background:#ffffff;"></button>
                <button class="color" data-color="#ff3333" style="background:#ff3333;"></button>
                <button class="color" data-color="#00b84a" style="background:#00b84a;"></button>
                <button class="color" data-color="#3f73ff" style="background:#3f73ff;"></button>
                <button class="color" data-color="#ffd43b" style="background:#ffd43b;"></button>
                <button class="color" data-color="#ff9f1c" style="background:#ff9f1c;"></button>
                <button class="color" data-color="#ff69b4" style="background:#ff69b4;"></button>
                <button class="color" data-color="#6c63ff" style="background:#6c63ff;"></button>
                <button class="color" data-color="#8b4513" style="background:#8b4513;"></button>


                <label class="custom-color">

                    <svg viewBox="0 0 24 24" class="custom-icon">
                        <path d="M12 3a9 9 0 1 0 9 9"></path>
                        <path d="M12 3v6"></path>
                        <path d="M3.5 7.5 9 10"></path>
                        <path d="m3.5 16.5 5.5-2.5"></path>
                    </svg>

                    <span>Pick Color</span>

                    <input
                        type="color"
                        id="customColor"
                        value="#6C63FF">

                </label>

            </div>

        </div>

    </section>


    <!-- =========================
         BOTTOM BAR
         ========================= -->

    <nav class="bottom-bar">

        <div class="bottom-group">


            <!-- CANVAS -->

            <div class="grid-size-control">

                <div class="canvas-control-icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                        <path d="M8 4v16"></path>
                        <path d="M12 4v16"></path>
                        <path d="M16 4v16"></path>
                        <path d="M4 8h16"></path>
                        <path d="M4 12h16"></path>
                        <path d="M4 16h16"></path>
                    </svg>
                </div>

                <label for="gridSize">
                    Canvas
                </label>

                <select id="gridSize">
                    <option value="16">16 × 16</option>
                    <option value="32">32 × 32</option>
                    <option value="64">64 × 64</option>
                </select>

            </div>


            <!-- UNDO -->

            <button id="undoButton" class="bottom-button">

                <svg viewBox="0 0 24 24">
                    <path d="M9 7 4 12l5 5"></path>
                    <path d="M5 12h8a6 6 0 0 1 6 6"></path>
                </svg>

                <span>Undo</span>

            </button>


            <!-- REDO -->

            <button id="redoButton" class="bottom-button">

                <svg viewBox="0 0 24 24">
                    <path d="m15 7 5 5-5 5"></path>
                    <path d="M19 12h-8a6 6 0 0 0-6 6"></path>
                </svg>

                <span>Redo</span>

            </button>


            <!-- THREE DOTS -->

            <details class="more-menu">

                <summary class="more-button">
                    <span></span>
                    <span></span>
                    <span></span>
                </summary>


                <div class="menu-panel">


                    <!-- LOAD -->

                    <button id="loadButton" class="menu-item">

                        <svg viewBox="0 0 24 24">
                            <path d="M3 7h6l2 2h10v10H3z"></path>
                        </svg>

                        <span>Load</span>

                    </button>


                    <!-- CLEAR -->

                    <button id="clearCanvas" class="menu-item">

                        <svg viewBox="0 0 24 24">
                            <path d="M5 7h14"></path>
                            <path d="M9 7V4h6v3"></path>
                            <path d="m8 7 1 13h6l1-13"></path>
                            <path d="M10 11v5"></path>
                            <path d="M14 11v5"></path>
                        </svg>

                        <span>Clear Canvas</span>

                    </button>


                    <!-- TEMPLATE -->

                    <div class="templates">

                        <div class="template-heading">

                            <svg viewBox="0 0 24 24">
                                <path d="M4 5h16v14H4z"></path>
                                <path d="M8 9h8"></path>
                                <path d="M8 13h5"></path>
                            </svg>

                            <label for="templateSelect">
                                Start From
                            </label>

                        </div>


                        <select id="templateSelect">

                            <option value="">
                                Choose a template
                            </option>

                            <option value="heart">
                                Heart
                            </option>

                            <option value="smiley">
                                Smiley
                            </option>

                            <option value="flower">
                                Flower
                            </option>

                            <option value="house">
                                House
                            </option>

                        </select>


                        <button
                            id="applyTemplate"
                            class="template-apply">

                            Use Template

                        </button>

                    </div>

                </div>

            </details>

        </div>

    </nav>


    <script src="js/app.js"></script>

</body>

</html>
